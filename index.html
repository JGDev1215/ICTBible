<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Knowledge Library</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #08090c;
            --bg-nav: #0d0f14;
            --bg-nav-hover: #13161d;
            --border: #1e2330;
            --text-primary: #e4e8f0;
            --text-secondary: #8892a8;
            --text-muted: #555d70;
            --accent: #d4a855;
            --accent-dim: rgba(212, 168, 85, 0.15);
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .library-shell {
            display: flex;
            flex: 1;
            min-height: 0;
        }

        /* Navigation Sidebar - Premium refinement */
        .nav-sidebar {
            width: 300px;
            min-width: 300px;
            background: linear-gradient(180deg, var(--bg-nav) 0%, rgba(13, 15, 20, 0.95) 100%);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform var(--transition), width var(--transition);
        }

        .nav-sidebar.collapsed {
            transform: translateX(-300px);
            width: 0;
            min-width: 0;
            border-right: none;
        }

        /* Toggle Button - Refined */
        .sidebar-toggle {
            position: fixed;
            top: 60px;
            left: 16px;
            z-index: 200;
            width: 40px;
            height: 40px;
            background: var(--bg-nav);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
            font-size: 18px;
            font-weight: 500;
        }

        .sidebar-toggle:hover {
            background: var(--bg-nav-hover);
            color: var(--accent);
            border-color: var(--accent);
            transform: scale(1.05);
        }

        .nav-sidebar:not(.collapsed) ~ .content-area .sidebar-toggle {
            left: 316px;
        }

        .nav-sidebar.collapsed ~ .content-area .sidebar-toggle {
            left: 16px;
        }

        .nav-header {
            padding: 28px 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(212, 168, 85, 0.05) 0%, transparent 100%);
        }

        .nav-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.01em;
            line-height: 1.2;
        }

        .nav-subtitle {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-top: 8px;
            font-weight: 500;
        }

        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .nav-item {
            display: block;
            padding: 12px 14px;
            margin-bottom: 2px;
            border-radius: 10px;
            cursor: pointer;
            transition: all var(--transition);
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(212, 168, 85, 0.08);
            border-color: var(--border);
        }

        .nav-item.active {
            background: var(--accent-dim);
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .nav-item-title {
            font-size: 0.86rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .nav-item.active .nav-item-title {
            color: var(--accent);
            font-weight: 600;
        }

        .nav-item-desc {
            font-size: 0.72rem;
            color: var(--text-muted);
            line-height: 1.35;
        }

        .nav-category {
            font-size: 0.62rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            padding: 18px 14px 10px;
            font-weight: 600;
            margin-top: 8px;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .content-header {
            padding: 14px 20px;
            padding-left: 68px;
            background: linear-gradient(90deg, var(--bg-nav) 0%, rgba(13, 15, 20, 0.95) 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all var(--transition);
        }

        .current-page {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
            flex: 1;
        }

        .open-new-tab {
            margin-left: auto;
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            font-weight: 500;
        }

        .open-new-tab:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }

        .header-btn {
            padding: 7px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.72rem;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            font-weight: 500;
        }

        .header-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
        }

        .content-frame {
            flex: 1;
            border: none;
            background: var(--bg-primary);
        }

        /* Welcome screen - Premium design */
        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 40px;
            text-align: center;
            overflow-y: auto;
        }

        .welcome-title {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .welcome-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            max-width: 480px;
            line-height: 1.6;
        }

        /* Global navigation bar */
        .global-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 24px;
            background: linear-gradient(90deg, var(--bg-nav) 0%, rgba(13, 15, 20, 0.95) 100%);
            border-bottom: 1px solid var(--border);
            font-family: inherit;
            position: sticky;
            top: 0;
            z-index: 999;
            backdrop-filter: blur(10px);
        }

        .global-brand {
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }

        .global-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .global-topbar a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.78rem;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            transition: all var(--transition);
            font-weight: 500;
        }

        .global-topbar a:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        @media (max-width: 520px) {
            .global-topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .global-links {
                margin-left: 0;
                width: 100%;
            }
        }

        .welcome-actions {
            margin-top: 32px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .welcome-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all var(--transition);
            font-weight: 500;
        }

        .welcome-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
            transform: translateY(-2px);
        }

        .welcome-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .welcome-btn.primary:hover {
            background: #e5b966;
            border-color: #e5b966;
            box-shadow: 0 4px 12px rgba(212, 168, 85, 0.2);
        }

        .bubble-options {
            margin-top: 48px;
            display: none;
            max-width: 900px;
            width: 100%;
            flex-direction: column;
            gap: 32px;
            text-align: left;
            padding-bottom: 60px;
        }

        .bubble-options.active {
            display: flex;
        }

        .category-section {
            width: 100%;
        }

        .category-header {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            margin-bottom: 14px;
            font-weight: 700;
            padding-left: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .category-bubbles {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .topic-bubble {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-nav);
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
            transition: all var(--transition);
            font-weight: 500;
        }

        .topic-bubble:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
            transform: translateY(-2px);
        }

        /* Scrollbar - Refined */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
            transition: all var(--transition);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-dim);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .nav-sidebar {
                position: fixed;
                left: -300px;
                z-index: 100;
                transition: left var(--transition);
                width: 300px;
                min-width: 300px;
            }
            .nav-sidebar.open {
                left: 0;
            }
            .nav-sidebar.collapsed {
                transform: none;
                left: -300px;
            }
            .sidebar-toggle {
                left: 16px !important;
                top: 60px;
            }
            .nav-sidebar.open ~ .content-area .sidebar-toggle {
                left: 316px !important;
            }
            .content-header {
                padding-left: 56px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .content-header .header-btn {
                font-size: 0.7rem;
                padding: 5px 10px;
            }
            .open-new-tab {
                font-size: 0.7rem;
                padding: 5px 10px;
            }
            .current-page {
                font-size: 0.7rem;
                max-width: 120px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .welcome-screen {
                padding: 40px 20px;
            }
            .welcome-title {
                font-size: 1.5rem;
            }
            .welcome-desc {
                font-size: 0.9rem;
            }
            .welcome-actions {
                gap: 10px;
            }
            .bubble-options {
                padding: 0 8px 40px;
                gap: 24px;
            }
            .topic-bubble {
                font-size: 0.72rem;
                padding: 6px 12px;
            }
            .category-header {
                font-size: 0.6rem;
            }
        }

        /* Small mobile */
        @media (max-width: 480px) {
            .nav-sidebar {
                width: 100%;
                min-width: 100%;
                left: -100%;
            }
            .nav-sidebar.open {
                left: 0;
            }
            .sidebar-toggle {
                left: 12px !important;
                top: 60px;
            }
            .nav-sidebar.open ~ .content-area .sidebar-toggle {
                left: auto !important;
                right: 12px;
            }
            .content-header {
                padding: 10px 12px;
                padding-left: 50px;
            }
            .welcome-actions {
                flex-direction: column;
                width: 100%;
            }
            .welcome-btn {
                width: 100%;
            }
            .welcome-screen {
                padding: 30px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="global-topbar">
        <div class="global-brand">ICT Library</div>
        <div class="global-links">
            <a href="index.html">Library Home</a>
            <a href="all-topics.html">Full Index</a>
        </div>
    </div>

    <div class="library-shell">
        <nav class="nav-sidebar">
        <div class="nav-header">
            <div class="nav-title">ICT Knowledge Library</div>
            <div class="nav-subtitle">Smart Money Concepts</div>
        </div>
        <div class="nav-list" id="navList"></div>
    </nav>

    <main class="content-area">
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle Sidebar">☰</button>
        <div class="content-header" id="contentHeader" style="display: none;">
            <span class="current-page" id="currentPage"></span>
            <button class="header-btn" id="goBackBtn">Go Back</button>
            <button class="header-btn" id="selectTopicBtn">Select New Topic</button>
            <button class="header-btn" id="openIndexBtn">Full Index</button>
            <button class="open-new-tab" id="openNewTab">Open in New Tab ↗</button>
        </div>

        <div class="welcome-screen" id="welcomeScreen">
            <div class="welcome-title">ICT Knowledge Library</div>
            <div class="welcome-desc">Select a topic from the sidebar or browse by category below.</div>
            <div class="welcome-actions">
                <button class="welcome-btn primary" id="startFreshBtn">Start Learning</button>
                <button class="welcome-btn" id="coreFrameworkBtn">Core Framework</button>
                <button class="welcome-btn" id="liquidityBtn">Liquidity & Imbalance</button>
                <button class="welcome-btn" id="timeSessionsBtn">Time & Sessions</button>
                <button class="welcome-btn" id="priceActionBtn">Price Action & PD Arrays</button>
                <button class="welcome-btn" id="entriesBtn">Entries & Management</button>
            </div>
            <div class="bubble-options" id="bubbleOptions" aria-live="polite"></div>
        </div>

        <iframe class="content-frame" id="contentFrame" style="display: none;"></iframe>
        </main>
    </div>

    <script>
        const navList = document.getElementById('navList');
        const contentFrame = document.getElementById('contentFrame');
        const contentHeader = document.getElementById('contentHeader');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const currentPageEl = document.getElementById('currentPage');
        const openNewTabBtn = document.getElementById('openNewTab');
        const goBackBtn = document.getElementById('goBackBtn');
        const selectTopicBtn = document.getElementById('selectTopicBtn');
        const openIndexBtn = document.getElementById('openIndexBtn');
        const startFreshBtn = document.getElementById('startFreshBtn');
        const coreFrameworkBtn = document.getElementById('coreFrameworkBtn');
        const liquidityBtn = document.getElementById('liquidityBtn');
        const timeSessionsBtn = document.getElementById('timeSessionsBtn');
        const priceActionBtn = document.getElementById('priceActionBtn');
        const entriesBtn = document.getElementById('entriesBtn');
        const showBubblesBtn = document.getElementById('showBubblesBtn');
        const bubbleOptions = document.getElementById('bubbleOptions');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const navSidebar = document.querySelector('.nav-sidebar');

        let currentPage = '';
        let navItems = [];
        let topicMap = new Map();
        let categories = [];

        // Check if mobile
        const isMobile = () => window.innerWidth <= 768;

        // Sidebar toggle functionality
        sidebarToggle.addEventListener('click', () => {
            if (isMobile()) {
                navSidebar.classList.toggle('open');
                sidebarToggle.textContent = navSidebar.classList.contains('open') ? '✕' : '☰';
            } else {
                navSidebar.classList.toggle('collapsed');
                sidebarToggle.textContent = navSidebar.classList.contains('collapsed') ? '☰' : '✕';
            }
        });

        async function loadTopics() {
            const response = await fetch('data/topics.json');
            if (!response.ok) {
                throw new Error('Failed to load topics data');
            }
            return response.json();
        }

        function buildNav(data) {
            navList.innerHTML = '';
            topicMap = new Map(data.topics.map(topic => [topic.file, topic]));
            categories = data.categories || [];

            categories.forEach(category => {
                const categoryEl = document.createElement('div');
                categoryEl.className = 'nav-category';
                categoryEl.textContent = category.title;
                navList.appendChild(categoryEl);

                (category.topics || []).forEach(page => {
                    const topic = topicMap.get(page);
                    if (!topic) {
                        return;
                    }
                    const item = document.createElement('div');
                    item.className = 'nav-item';
                    item.dataset.page = page;

                    const title = document.createElement('div');
                    title.className = 'nav-item-title';
                    title.textContent = topic.title;

                    const desc = document.createElement('div');
                    desc.className = 'nav-item-desc';
                    desc.textContent = topic.desc;

                    item.appendChild(title);
                    item.appendChild(desc);
                    navList.appendChild(item);
                });
            });

            navItems = Array.from(navList.querySelectorAll('.nav-item'));
        }

        function bindNavClicks() {
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    const page = item.dataset.page;
                    loadPage(page);
                    setActivePage(page);

                    if (isMobile()) {
                        navSidebar.classList.remove('open');
                        sidebarToggle.textContent = '☰';
                    }
                });
            });
        }

        function setActivePage(page) {
            navItems.forEach(i => i.classList.remove('active'));
            const match = navItems.find(i => i.dataset.page === page);
            if (match) {
                match.classList.add('active');
            }
        }

        function loadPage(page) {
            currentPage = page;
            contentFrame.src = page;
            contentFrame.style.display = 'block';
            welcomeScreen.style.display = 'none';
            contentHeader.style.display = 'flex';
            const topic = topicMap.get(page);
            currentPageEl.textContent = topic ? topic.title : page;
        }

        function showWelcome() {
            currentPage = '';
            contentFrame.src = '';
            contentFrame.style.display = 'none';
            contentHeader.style.display = 'none';
            welcomeScreen.style.display = 'flex';
            navItems.forEach(i => i.classList.remove('active'));
        }

        function buildBubbleOptions() {
            bubbleOptions.innerHTML = '';
            const fragment = document.createDocumentFragment();

            categories.forEach(category => {
                const section = document.createElement('div');
                section.className = 'category-section';

                const header = document.createElement('div');
                header.className = 'category-header';
                header.textContent = category.title;
                section.appendChild(header);

                const bubblesContainer = document.createElement('div');
                bubblesContainer.className = 'category-bubbles';

                (category.topics || []).forEach(page => {
                    const topic = topicMap.get(page);
                    if (!topic) {
                        return;
                    }
                    const bubble = document.createElement('button');
                    bubble.type = 'button';
                    bubble.className = 'topic-bubble';
                    bubble.textContent = topic.title;
                    bubble.dataset.page = page;
                    bubble.addEventListener('click', () => {
                        setActivePage(page);
                        loadPage(page);
                    });
                    bubblesContainer.appendChild(bubble);
                });

                section.appendChild(bubblesContainer);
                fragment.appendChild(section);
            });

            bubbleOptions.appendChild(fragment);
        }

        openNewTabBtn.addEventListener('click', () => {
            if (currentPage) {
                window.open(currentPage, '_blank');
            }
        });

        openIndexBtn.addEventListener('click', () => {
            window.location.href = 'all-topics.html';
        });

        goBackBtn.addEventListener('click', () => {
            showWelcome();
            bubbleOptions.classList.remove('active');
        });

        selectTopicBtn.addEventListener('click', () => {
            showWelcome();
            bubbleOptions.classList.add('active');
        });

        startFreshBtn.addEventListener('click', () => {
            const firstPage = 'ict_SMC.html';
            loadPage(firstPage);
            setActivePage(firstPage);
            bubbleOptions.classList.remove('active');
        });

        if (showBubblesBtn) {
            showBubblesBtn.addEventListener('click', () => {
                bubbleOptions.classList.toggle('active');
            });
        }

        coreFrameworkBtn.addEventListener('click', () => {
            window.location.href = 'category-core-framework.html';
        });

        liquidityBtn.addEventListener('click', () => {
            window.location.href = 'category-liquidity-imbalance.html';
        });

        timeSessionsBtn.addEventListener('click', () => {
            window.location.href = 'category-time-sessions.html';
        });

        priceActionBtn.addEventListener('click', () => {
            window.location.href = 'category-price-action.html';
        });

        entriesBtn.addEventListener('click', () => {
            window.location.href = 'category-entries-management.html';
        });

        async function initLibrary() {
            try {
                const data = await loadTopics();
                buildNav(data);
                bindNavClicks();
                buildBubbleOptions();
            } catch (error) {
                console.error(error);
            }
        }

        initLibrary();
    </script>
</body>
</html>
