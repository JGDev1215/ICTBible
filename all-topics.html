<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Knowledge Library - Full Index</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #08090c;
            --bg-nav: #0d0f14;
            --bg-nav-hover: #13161d;
            --border: #1e2330;
            --text-primary: #e4e8f0;
            --text-secondary: #8892a8;
            --text-muted: #555d70;
            --accent: #d4a855;
            --accent-dim: rgba(212, 168, 85, 0.15);
            --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(90deg, var(--bg-nav) 0%, rgba(13, 15, 20, 0.95) 100%);
            border-bottom: 1px solid var(--border);
            padding: 20px 28px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 600;
        }

        .back-btn {
            margin-left: auto;
            padding: 9px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.78rem;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            font-weight: 500;
        }

        .back-btn:hover {
            background: var(--accent-dim);
            color: var(--accent);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        main {
            padding: 40px 32px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 0.75rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .lead {
            color: var(--text-secondary);
            font-size: 0.98rem;
            margin: 8px 0 36px;
            max-width: 700px;
            line-height: 1.7;
        }

        .az-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px 18px;
            margin-bottom: 48px;
        }

        .topic-link {
            display: block;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            color: var(--text-primary);
            text-decoration: none;
            background: linear-gradient(135deg, rgba(13, 15, 20, 0.8) 0%, rgba(13, 15, 20, 0.4) 100%);
            transition: all var(--transition);
            font-size: 0.86rem;
            font-weight: 500;
        }

        .topic-link:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(212, 168, 85, 0.1);
        }

        .category {
            margin-top: 44px;
        }

        .category-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 18px;
            letter-spacing: -0.01em;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
        }

        .category-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px 18px;
        }

        .muted {
            color: var(--text-muted);
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            header {
                padding: 16px 20px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .title {
                font-size: 1.1rem;
            }
            .subtitle {
                font-size: 0.65rem;
            }
            .back-btn {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
            main {
                padding: 28px 20px 48px;
            }
            .section-title {
                font-size: 0.7rem;
            }
            .lead {
                font-size: 0.9rem;
                margin: 8px 0 24px;
            }
            .az-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px 14px;
                margin-bottom: 36px;
            }
            .topic-link {
                padding: 10px 12px;
                font-size: 0.8rem;
            }
            .category {
                margin-top: 32px;
            }
            .category-title {
                font-size: 0.98rem;
                margin-bottom: 14px;
            }
            .category-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px 12px;
            }
        }

        /* Small mobile */
        @media (max-width: 480px) {
            header {
                padding: 14px 16px;
            }
            main {
                padding: 20px 14px 40px;
            }
            .topic-link {
                padding: 10px 12px;
                font-size: 0.78rem;
                border-radius: 8px;
            }
            .az-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .category-list {
                grid-template-columns: 1fr;
            }
        }

        /* Global navigation bar */
        .global-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 14px 28px;
            background: linear-gradient(90deg, var(--bg-nav) 0%, rgba(13, 15, 20, 0.95) 100%);
            border-bottom: 1px solid var(--border);
            font-family: inherit;
            position: sticky;
            top: 0;
            z-index: 999;
            backdrop-filter: blur(10px);
        }
        .global-brand {
            font-size: 0.68rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
        }
        .global-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-left: auto;
        }
        .global-topbar a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.78rem;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: transparent;
            transition: all var(--transition);
            font-weight: 500;
        }
        .global-topbar a:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
            transform: translateY(-2px);
        }
        @media (max-width: 520px) {
            .global-topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding: 12px 16px;
            }
            .global-links {
                margin-left: 0;
                width: 100%;
            }
        }
</style>
</head>
<body>
    <div class="global-topbar">
        <div class="global-brand">ICT Library</div>
        <div class="global-links">
            <a href="index.html">Library Home</a>
            <a href="all-topics.html">Full Index</a>
        </div>
    </div>

    <header>
        <div>
            <div class="title">ICT Knowledge Library</div>
            <div class="subtitle">Full Index</div>
        </div>
        <a class="back-btn" href="index.html">Back to Library</a>
    </header>

    <main>
        <div class="section-title">All Topics A-Z</div>
        <div class="lead">A clean alphabetical list for fast scanning and direct access.</div>
        <div class="az-grid" id="azGrid"></div>

        <div class="section-title">Browse by Category</div>
        <div class="lead muted">Grouped for deeper study sessions and faster recall.</div>
        <div id="categoryGroups"></div>
    </main>
<script>
        const azGrid = document.getElementById('azGrid');
        const categoryGroups = document.getElementById('categoryGroups');
        const newline = '
';

        async function loadTopics() {
            const response = await fetch('data/topics.json');
            if (!response.ok) {
                throw new Error('Failed to load topics data');
            }
            return response.json();
        }

        function renderAZ(topics, categories) {
            const entries = [];

            topics.forEach(topic => {
                entries.push({ label: topic.title, href: topic.file });
            });

            categories.forEach(category => {
                if (category.page) {
                    entries.push({ label: `Category: ${category.title}`, href: category.page });
                }
            });

            entries.sort((a, b) => a.label.localeCompare(b.label));
            azGrid.innerHTML = entries.map(entry => (
                `            <a class="topic-link" href="${entry.href}">${entry.label}</a>`
            )).join(newline);
        }

        function renderCategories(categories, topicMap) {
            categoryGroups.innerHTML = categories.map(category => {
                const links = (category.topics || []).map(page => {
                    const topic = topicMap.get(page);
                    if (!topic) {
                        return '';
                    }
                    return `                <a class="topic-link" href="${topic.file}">${topic.title}</a>`;
                }).filter(Boolean).join(newline);

                return (
                    `        <div class="category">${newline}`
                    + `            <div class="category-title">${category.title}</div>${newline}`
                    + `            <div class="category-list">${newline}`
                    + `${links}${newline}`
                    + `            </div>${newline}`
                    + `        </div>`
                );
            }).join(`${newline}${newline}`);
        }

        async function initTopics() {
            try {
                const data = await loadTopics();
                const topicMap = new Map(data.topics.map(topic => [topic.file, topic]));
                renderAZ(data.topics, data.categories || []);
                renderCategories(data.categories || [], topicMap);
            } catch (error) {
                console.error(error);
            }
        }

        initTopics();
    </script>
</body>
</html>
