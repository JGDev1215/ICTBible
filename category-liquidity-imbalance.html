<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Knowledge Library - Liquidity, Fair Value & Imbalance</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #08090c;
            --bg-nav: #0d0f14;
            --bg-nav-hover: #13161d;
            --border: #1e2330;
            --text-primary: #e4e8f0;
            --text-secondary: #8892a8;
            --text-muted: #555d70;
            --accent: #d4a855;
            --accent-dim: rgba(212, 168, 85, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .global-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 10px 18px;
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 999;
            backdrop-filter: blur(6px);
        }
        .global-brand {
            font-size: 0.72rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }
        .global-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .global-topbar a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: transparent;
            transition: all 0.15s ease;
        }
        .global-topbar a:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        header {
            padding: 28px 24px 10px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 8px;
            max-width: 640px;
            line-height: 1.6;
        }

        .header-container {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .back-btn {
            padding: 8px 16px;
            margin-top: 4px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            white-space: nowrap;
            display: inline-block;
            font-weight: 500;
        }

        .back-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        main {
            padding: 18px 24px 48px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 14px;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            background: var(--bg-nav);
            transition: all 0.15s ease;
        }

        .card:hover {
            border-color: var(--accent);
            background: var(--bg-nav-hover);
        }

        .card a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.4;
        }

        @media (max-width: 520px) {
            .global-topbar {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="global-topbar">
        <div class="global-brand">ICT Library</div>
        <div class="global-links">
            <a href="index.html">Library Home</a>
            <a href="all-topics.html">Full Index</a>
        </div>
    </div>

    <header>
        <div class="header-container">
            <div>
                <div class="title">Liquidity, Fair Value & Imbalance</div>
                <div class="subtitle">Where price seeks liquidity, balance, and inefficiencies.</div>
            </div>
            <a href="index.html" class="back-btn">← Back</a>
        </div>
    </header>

    <main>
        <div class="grid" id="categoryGrid"></div>
    </main>
<script>
        const categoryId = 'liquidity-imbalance';
        const categoryGrid = document.getElementById('categoryGrid');
        const newline = '
';

        async function loadTopics() {
            const response = await fetch('data/topics.json');
            if (!response.ok) {
                throw new Error('Failed to load topics data');
            }
            return response.json();
        }

        function renderCategory(category, topicMap) {
            if (!category) {
                categoryGrid.innerHTML = '';
                return;
            }
            const cards = (category.topics || []).map(page => {
                const topic = topicMap.get(page);
                if (!topic) {
                    return '';
                }
                return (
                    `            <div class="card">${newline}`
                    + `                <a href="${topic.file}">${topic.title}</a>${newline}`
                    + `                <p>${topic.desc}</p>${newline}`
                    + `            </div>`
                );
            }).filter(Boolean).join(newline);
            categoryGrid.innerHTML = cards;
        }

        async function initCategory() {
            try {
                const data = await loadTopics();
                const topicMap = new Map(data.topics.map(topic => [topic.file, topic]));
                const category = (data.categories || []).find(item => item.id === categoryId);
                renderCategory(category, topicMap);
            } catch (error) {
                console.error(error);
            }
        }

        initCategory();
    </script>
</body>
</html>
